<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escales — Hébergements de voyageurs</title>

<!-- Leaflet CSS via cdnjs -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

<!-- Polices -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ===== Jetons de design ===== */
  :root {
    --fond: #F2EFE6;
    --fond-carte: #E8E4D6;
    --encre: #1B2E28;
    --encre-clair: #4A5C55;
    --accent: #C79A3D;
    --accent-fonce: #9C7526;
    --sauge: #3D6B5C;
    --bordure: #D9D3C3;
    --blanc: #FFFFFF;
    --erreur: #A6432F;

    --police-titre: 'Space Grotesk', sans-serif;
    --police-texte: 'Work Sans', sans-serif;
    --police-donnee: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fond);
    color: var(--encre);
    font-family: var(--police-texte);
  }

  /* ===== En-tête ===== */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--bordure);
  }

  /* Tampon "postmark" — élément signature de l'identité visuelle */
  .tampon {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px dashed var(--accent-fonce);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-8deg);
    font-family: var(--police-titre);
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-fonce);
    background: var(--blanc);
  }

  .titre-app h1 {
    font-family: var(--police-titre);
    font-weight: 700;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .titre-app p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--encre-clair);
  }

  /* ===== Zone de recherche ===== */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 18px 20px 32px;
  }

  .zone-recherche {
    position: relative;
    margin-bottom: 18px;
  }

  label.libelle-recherche {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--encre-clair);
    margin-bottom: 6px;
  }

  #champ-recherche {
    width: 100%;
    padding: 13px 44px 13px 14px;
    font-size: 16px;
    font-family: var(--police-texte);
    border: 1.5px solid var(--bordure);
    border-radius: 10px;
    background: var(--blanc);
    color: var(--encre);
    outline: none;
    transition: border-color 0.15s ease;
  }

  #champ-recherche:focus {
    border-color: var(--accent);
  }

  .indicateur-recherche {
    position: absolute;
    right: 14px;
    top: 38px;
    width: 18px;
    height: 18px;
    border: 2px solid var(--bordure);
    border-top-color: var(--accent-fonce);
    border-radius: 50%;
    animation: tourner 0.7s linear infinite;
    display: none;
  }

  .indicateur-recherche.visible { display: block; }

  @keyframes tourner {
    to { transform: rotate(360deg); }
  }

  /* Liste de suggestions */
  .liste-suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: var(--blanc);
    border: 1.5px solid var(--bordure);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(27, 46, 40, 0.1);
    max-height: 280px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
  }

  .liste-suggestions.visible { display: block; }

  .suggestion {
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--bordure);
    font-size: 14px;
  }

  .suggestion:last-child { border-bottom: none; }

  .suggestion:hover,
  .suggestion:focus,
  .suggestion.actif {
    background: var(--fond);
  }

  .suggestion .nom-lieu {
    font-weight: 500;
    color: var(--encre);
  }

  .suggestion .detail-lieu {
    font-size: 12px;
    color: var(--encre-clair);
    margin-top: 2px;
  }

  .message-suggestion {
    padding: 12px 14px;
    font-size: 13px;
    color: var(--encre-clair);
  }

  /* ===== Carte ===== */
  #carte {
    width: 100%;
    height: 58vh;
    min-height: 340px;
    border-radius: 12px;
    border: 1.5px solid var(--bordure);
    background: var(--fond-carte);
  }

  @media (min-width: 700px) {
    #carte { height: 65vh; }
  }

  /* ===== Légende des types d'hébergement ===== */
  .legende {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--encre-clair);
  }

  .legende-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legende-pastille {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ===== Icônes de marqueurs (tampon miniature par type) ===== */
  .icone-tampon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px dashed var(--blanc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(27, 46, 40, 0.35);
  }

  /* ===== Contenu des popups Leaflet ===== */
  .leaflet-popup-content-wrapper {
    border-radius: 10px;
    font-family: var(--police-texte);
  }

  .popup-hebergement { min-width: 190px; }

  .popup-hebergement .popup-type {
    display: inline-block;
    font-family: var(--police-donnee);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 20px;
    color: var(--blanc);
    margin-bottom: 6px;
  }

  .popup-hebergement h3 {
    font-family: var(--police-titre);
    font-size: 15px;
    margin: 0 0 4px;
  }

  .popup-hebergement .popup-lieu {
    font-size: 12px;
    color: var(--encre-clair);
    margin-bottom: 6px;
  }

  .popup-hebergement .popup-description {
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .popup-hebergement .popup-lien {
    display: inline-block;
    font-size: 13px;
    font-weight: 500;
    color: var(--blanc);
    background: var(--sauge);
    padding: 7px 12px;
    border-radius: 8px;
    text-decoration: none;
  }

  .popup-hebergement .popup-lien:hover {
    background: var(--encre);
  }

  /* Focus clavier visible, accessibilité */
  a:focus-visible,
  button:focus-visible,
  .suggestion:focus-visible {
    outline: 2px solid var(--sauge);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="tampon">EV</div>
  <div class="titre-app">
    <h1>Escales</h1>
    <p>Hébergements de voyageurs près de chez vous</p>
  </div>
</header>

<main>
  <div class="zone-recherche">
    <label class="libelle-recherche" for="champ-recherche">Rechercher une ville ou un lieu</label>
    <input
      type="text"
      id="champ-recherche"
      placeholder="Ex : Bordeaux, Lisbonne, Chiang Mai…"
      autocomplete="off"
    />
    <div class="indicateur-recherche" id="indicateur-recherche"></div>
    <div class="liste-suggestions" id="liste-suggestions" role="listbox"></div>
  </div>

  <div class="legende" id="legende"></div>

  <div id="carte"></div>
</main>

<!-- Leaflet JS via cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
  // ===== Initialisation de la carte =====
  // Vue par défaut centrée sur la France, sera recentrée après une recherche
  const carte = L.map('carte').setView([46.6, 2.2], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(carte);

  let marqueurRecherche = null;

  // ===== Configuration visuelle par type de réseau =====
  // Couleurs cohérentes avec les jetons de design, réutilisées pour icônes,
  // badges de popup et légende
  const typesReseaux = {
    couchsurfing: { libelle: 'Couchsurfing', couleur: '#C79A3D', abbrev: 'CS' },
    wwoofing:     { libelle: 'WWOOFing',     couleur: '#3D6B5C', abbrev: 'WW' },
    autre:        { libelle: 'Autre réseau', couleur: '#6B5CA5', abbrev: '•' }
  };

  // ===== Données de démonstration =====
  // Tableau JSON en dur — à remplacer par une vraie base de données.
  // Chaque entrée pointe vers un lien de profil externe, jamais de contact direct.
  const hebergementsDemo = [
    {
      id: 1, nom: 'Chez Amina', type: 'couchsurfing',
      ville: 'Bordeaux, France', lat: 44.8412, lon: -0.5798,
      description: 'Canapé disponible dans un appartement chaleureux près des quais.',
      lienProfil: 'https://www.couchsurfing.com/'
    },
    {
      id: 2, nom: 'Ferme du Vallon', type: 'wwoofing',
      ville: 'Sarlat-la-Canéda, France', lat: 44.8905, lon: 1.2160,
      description: 'Maraîchage bio, hébergement en dortoir contre 4h d\'aide par jour.',
      lienProfil: 'https://wwoof.fr/'
    },
    {
      id: 3, nom: 'Chez Julien & Marta', type: 'couchsurfing',
      ville: 'Lyon, France', lat: 45.7640, lon: 4.8357,
      description: 'Matelas gonflable dans le salon, quartier animé de la Croix-Rousse.',
      lienProfil: 'https://www.couchsurfing.com/'
    },
    {
      id: 4, nom: 'Refuge des Cimes', type: 'autre',
      ville: 'Annecy, France', lat: 45.8992, lon: 6.1294,
      description: 'Échange gîte contre coup de main sur un réseau d\'hospitalité local.',
      lienProfil: 'https://www.helpx.net/'
    },
    {
      id: 5, nom: 'Domaine Terra Viva', type: 'wwoofing',
      ville: 'Avignon, France', lat: 43.9493, lon: 4.8055,
      description: 'Vignoble en permaculture, chambre individuelle et repas partagés.',
      lienProfil: 'https://wwoof.fr/'
    },
    {
      id: 6, nom: 'Chez Yasmine', type: 'couchsurfing',
      ville: 'Lisbonne, Portugal', lat: 38.7223, lon: -9.1393,
      description: 'Chambre d\'ami avec vue sur le Tage, accueil de voyageurs solo.',
      lienProfil: 'https://www.couchsurfing.com/'
    },
    {
      id: 7, nom: 'Ecolieu Les Sources', type: 'autre',
      ville: 'Toulouse, France', lat: 43.6047, lon: 1.4442,
      description: 'Habitat participatif ouvert aux voyageurs pour quelques nuits.',
      lienProfil: 'https://www.helpx.net/'
    },
    {
      id: 8, nom: 'Verger de la Colline', type: 'wwoofing',
      ville: 'Nantes, France', lat: 47.2184, lon: -1.5536,
      description: 'Petit verger familial, cabane en bois pour les bénévoles.',
      lienProfil: 'https://wwoof.fr/'
    }
  ];

  // Crée une icône Leaflet en forme de tampon coloré selon le type
  function creerIconeTampon(type) {
    const config = typesReseaux[type] || typesReseaux.autre;
    return L.divIcon({
      className: '', // évite les styles par défaut de Leaflet
      html: `<div class="icone-tampon" style="background:${config.couleur}">${config.abbrev}</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      popupAnchor: [0, -15]
    });
  }

  // Construit le contenu HTML d'une popup d'hébergement
  function construirePopup(hebergement) {
    const config = typesReseaux[hebergement.type] || typesReseaux.autre;
    return `
      <div class="popup-hebergement">
        <span class="popup-type" style="background:${config.couleur}">${config.libelle}</span>
        <h3>${hebergement.nom}</h3>
        <div class="popup-lieu">${hebergement.ville}</div>
        <div class="popup-description">${hebergement.description}</div>
        <a class="popup-lien" href="${hebergement.lienProfil}" target="_blank" rel="noopener noreferrer">
          Voir le profil ↗
        </a>
      </div>
    `;
  }

  // Affiche tous les hébergements de démonstration sur la carte
  function afficherHebergements(liste) {
    liste.forEach((hebergement) => {
      L.marker([hebergement.lat, hebergement.lon], {
        icon: creerIconeTampon(hebergement.type)
      })
        .addTo(carte)
        .bindPopup(construirePopup(hebergement));
    });
  }

  // Construit la légende à partir de la configuration des types
  function afficherLegende() {
    const legende = document.getElementById('legende');
    legende.innerHTML = Object.values(typesReseaux).map(config => `
      <div class="legende-item">
        <span class="legende-pastille" style="background:${config.couleur}"></span>
        ${config.libelle}
      </div>
    `).join('');
  }

  afficherHebergements(hebergementsDemo);
  afficherLegende();

  // ===== Éléments du DOM =====
  const champRecherche = document.getElementById('champ-recherche');
  const listeSuggestions = document.getElementById('liste-suggestions');
  const indicateurRecherche = document.getElementById('indicateur-recherche');

  let delaiRecherche = null; // pour le debounce
  let suggestionsActuelles = [];

  // ===== Géocodage via l'API Nominatim (OpenStreetMap) =====
  async function rechercherLieux(requete) {
    // Nominatim demande un usage raisonnable : on limite les résultats
    // et on respecte un délai avant chaque appel (debounce plus bas)
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(requete)}&limit=5&addressdetails=1&accept-language=fr`;

    const reponse = await fetch(url);
    if (!reponse.ok) throw new Error('Échec de la requête Nominatim');
    return reponse.json();
  }

  function afficherSuggestions(resultats) {
    suggestionsActuelles = resultats;
    listeSuggestions.innerHTML = '';

    if (resultats.length === 0) {
      listeSuggestions.innerHTML = '<div class="message-suggestion">Aucun lieu trouvé.</div>';
      listeSuggestions.classList.add('visible');
      return;
    }

    resultats.forEach((lieu, index) => {
      const item = document.createElement('div');
      item.className = 'suggestion';
      item.setAttribute('role', 'option');
      item.tabIndex = 0;

      const nomPrincipal = lieu.display_name.split(',')[0];
      const detail = lieu.display_name.split(',').slice(1, 3).join(',').trim();

      item.innerHTML = `
        <div class="nom-lieu">${nomPrincipal}</div>
        <div class="detail-lieu">${detail}</div>
      `;

      const selectionner = () => choisirLieu(lieu);
      item.addEventListener('click', selectionner);
      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') selectionner();
      });

      listeSuggestions.appendChild(item);
    });

    listeSuggestions.classList.add('visible');
  }

  function choisirLieu(lieu) {
    const lat = parseFloat(lieu.lat);
    const lon = parseFloat(lieu.lon);

    carte.setView([lat, lon], 13);

    if (marqueurRecherche) carte.removeLayer(marqueurRecherche);
    marqueurRecherche = L.marker([lat, lon]).addTo(carte)
      .bindPopup(lieu.display_name.split(',')[0])
      .openPopup();

    champRecherche.value = lieu.display_name.split(',')[0];
    listeSuggestions.classList.remove('visible');
  }

  // ===== Écoute de la saisie avec debounce =====
  champRecherche.addEventListener('input', () => {
    const valeur = champRecherche.value.trim();

    clearTimeout(delaiRecherche);

    if (valeur.length < 3) {
      listeSuggestions.classList.remove('visible');
      return;
    }

    delaiRecherche = setTimeout(async () => {
      indicateurRecherche.classList.add('visible');
      try {
        const resultats = await rechercherLieux(valeur);
        afficherSuggestions(resultats);
      } catch (erreur) {
        listeSuggestions.innerHTML = '<div class="message-suggestion">Erreur lors de la recherche. Réessayez.</div>';
        listeSuggestions.classList.add('visible');
      } finally {
        indicateurRecherche.classList.remove('visible');
      }
    }, 400); // délai pour limiter les appels à Nominatim
  });

  // Fermer les suggestions si on clique ailleurs
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.zone-recherche')) {
      listeSuggestions.classList.remove('visible');
    }
  });
</script>

</body>
</html>
