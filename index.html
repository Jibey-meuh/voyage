<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌍 Hébergements · Carte & Distances</title>
  <!-- Google Fonts : Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Google Maps JS API (chargée en fin de body) -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #faf3ed;  /* beige chaud */
      color: #3e2e28;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ===== EN-TÊTE & CHAMP AUTOCOMPLETE ===== */
    .search-section {
      background: #fff9f4;
      padding: 1.2rem 1.5rem;
      border-radius: 48px;
      box-shadow: 0 6px 18px rgba(180, 120, 80, 0.12);
      margin-bottom: 1.8rem;
      border: 1px solid #f0ded0;
    }

    .search-section label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #a67c5c;
      letter-spacing: 0.5px;
      margin-bottom: 0.35rem;
    }

    .autocomplete-wrapper {
      position: relative;
      width: 100%;
    }

    #pac-input {
      width: 100%;
      padding: 1rem 1.5rem;
      border: 2px solid #ebd7c8;
      border-radius: 60px;
      font-size: 1rem;
      background: #fefcf9;
      color: #3e2e28;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    #pac-input:focus {
      border-color: #dbaa7a;
      box-shadow: 0 0 0 4px rgba(219, 170, 122, 0.2);
    }

    #pac-input::placeholder {
      color: #baa08c;
      font-weight: 300;
    }

    /* ===== CARTE ===== */
    #map {
      width: 100%;
      height: 55vh;
      min-height: 400px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(140, 100, 70, 0.15);
      border: 1px solid #e6d4c4;
      margin-bottom: 2rem;
      background: #ece3da; /* fallback */
    }

    /* ===== TABLEAU DES DISTANCES ===== */
    .distances-section {
      background: #fff9f4;
      border-radius: 28px;
      padding: 1.5rem 1.8rem;
      box-shadow: 0 6px 20px rgba(150, 110, 80, 0.08);
      border: 1px solid #f0ded0;
      margin-top: 0.25rem;
    }

    .distances-section h2 {
      font-weight: 600;
      font-size: 1.2rem;
      color: #6b4d38;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .distances-section h2 small {
      font-weight: 400;
      font-size: 0.75rem;
      color: #a4846c;
      background: #f0e4da;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }

    .table-responsive {
      overflow-x: auto;
      border-radius: 18px;
    }

    #distance-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 520px;
    }

    #distance-table th {
      text-align: left;
      padding: 0.9rem 0.5rem 0.6rem 0.5rem;
      font-weight: 600;
      color: #5c4433;
      border-bottom: 2px solid #e4d2c2;
      letter-spacing: 0.3px;
    }

    #distance-table td {
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid #eee3da;
      color: #3f3128;
    }

    #distance-table tr:last-child td {
      border-bottom: none;
    }

    #distance-table .type-badge {
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      background: #f0e4da;
      color: #4d3a2c;
      letter-spacing: 0.3px;
    }

    .dist-note {
      display: inline-block;
      background: #f7eee7;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.8rem;
    }

    .dist-avi {
      color: #7d6452;
      font-size: 0.75rem;
    }

    .distance-value {
      font-weight: 500;
      color: #a56f4a;
    }

    .empty-row td {
      padding: 1.2rem 0.5rem;
      text-align: center;
      color: #a4846c;
      font-style: italic;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      body { padding: 0.6rem; }
      .search-section { padding: 1rem; }
      #pac-input { padding: 0.8rem 1.2rem; }
      .distances-section { padding: 1rem; }
      #map { min-height: 300px; }
    }

    /* petites retouches */
    .text-muted {
      color: #a4846c;
      font-weight: 300;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- CHAMP AUTOCOMPLETE -->
  <div class="search-section">
    <label for="pac-input">📍 Choisissez une ville ou une adresse</label>
    <div class="autocomplete-wrapper">
      <input id="pac-input" type="text" placeholder="Recherchez une ville, une adresse..." />
    </div>
  </div>

  <!-- CARTE -->
  <div id="map"></div>

  <!-- TABLEAU DES DISTANCES -->
  <div class="distances-section">
    <h2>
      🚗 Distances depuis le lieu sélectionné
      <small id="origin-label">Paris (défaut)</small>
    </h2>
    <div class="table-responsive">
      <table id="distance-table">
        <thead>
          <tr>
            <th>Hébergement</th>
            <th>Type</th>
            <th>Note</th>
            <th>Distance (km)</th>
          </tr>
        </thead>
        <tbody id="distance-body">
          <!-- Rempli par JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ============================================================ -->
<!-- Google Maps API + JS intégré                                 -->
<!-- ============================================================ -->
<script>
  // ----- DONNÉES SIMULÉES (exactement selon cahier des charges) -----
  const hebergements = [
    { nom: "Chez Marie", type: "Couchsurfing", contact: "marie@example.com", lat: 48.8566, lng: 2.3522, note: 4.5, avis: 23 },
    { nom: "Ferme Bio Valérie", type: "Wwoofing", contact: "valerie@fermebio.fr", lat: 48.8600, lng: 2.3400, note: 4.8, avis: 41 },
    { nom: "Auberge du Voyageur", type: "Couchsurfing", contact: "auberge@example.com", lat: 48.8700, lng: 2.3600, note: 4.2, avis: 17 },
    { nom: "Jardin Partagé HelpX", type: "HelpX", contact: "helpx@jardin.fr", lat: 48.8500, lng: 2.3700, note: 4.6, avis: 34 },
    { nom: "Loft Urbain Gratuit", type: "Couchsurfing", contact: "loft@urbain.fr", lat: 48.8450, lng: 2.3300, note: 3.9, avis: 12 },
    { nom: "Ferme Pédagogique", type: "Wwoofing", contact: "pedago@ferme.fr", lat: 48.8300, lng: 2.4000, note: 4.7, avis: 56 },
    { nom: "Studio Échange Maison", type: "HomeExchange", contact: "studio@echange.fr", lat: 48.8800, lng: 2.3200, note: 4.3, avis: 29 },
    { nom: "Yourte Couchsurfing", type: "Couchsurfing", contact: "yourte@nature.fr", lat: 48.8400, lng: 2.4200, note: 4.1, avis: 19 },
    { nom: "Potager Collectif", type: "Wwoofing", contact: "potager@collectif.org", lat: 48.8200, lng: 2.3500, note: 4.9, avis: 62 },
    { nom: "Appart'Artiste", type: "HelpX", contact: "art@helpx.fr", lat: 48.8650, lng: 2.3800, note: 4.0, avis: 8 }
  ];

  // ----- COULEURS PAR TYPE -----
  const typeColors = {
    'Couchsurfing': '#3182ce', // bleu
    'Wwoofing': '#38a169',     // vert
    'HelpX': '#dd6b20',        // orange
    'HomeExchange': '#e53e3e', // rouge (Autre)
    'default': '#e53e3e'
  };

  // ----- VARIABLES GLOBALES -----
  let map;
  let markers = [];
  let infoWindow = null;
  let autocomplete;
  let currentOrigin = { lat: 48.8566, lng: 2.3522 }; // Paris par défaut
  let originLabel = 'Paris (défaut)';

  // ----- ÉLÉMENTS DOM -----
  const distanceBody = document.getElementById('distance-body');
  const originLabelEl = document.getElementById('origin-label');

  // ----- FONCTIONS UTILITAIRES -----
  function getColorForType(type) {
    return typeColors[type] || typeColors.default;
  }

  // Calcul de distance (Haversine) en km entre deux points
  function haversineDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const toRad = (deg) => (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // ----- METTRE À JOUR LE TABLEAU DES DISTANCES -----
  function updateDistanceTable(originLat, originLng) {
    const rows = hebergements.map(h => {
      const dist = haversineDistance(originLat, originLng, h.lat, h.lng);
      return { ...h, distance: dist };
    });
    // tri par distance croissante
    rows.sort((a, b) => a.distance - b.distance);

    // construction du HTML
    let html = '';
    if (rows.length === 0) {
      html = `<tr class="empty-row"><td colspan="4">Aucun hébergement trouvé</td></tr>`;
    } else {
      rows.forEach(h => {
        const noteStr = h.note.toFixed(1);
        html += `<tr>
          <td><strong>${h.nom}</strong></td>
          <td><span class="type-badge" style="background:${getColorForType(h.type)}20; color:${getColorForType(h.type)};">${h.type}</span></td>
          <td><span class="dist-note">⭐ ${noteStr}</span> <span class="dist-avi">(${h.avis} avis)</span></td>
          <td class="distance-value">${h.distance.toFixed(1)} km</td>
        </tr>`;
      });
    }
    distanceBody.innerHTML = html;
  }

  // ----- CRÉER LES MARQUEURS (avec InfoWindow) -----
  function createMarkers() {
    // supprimer les anciens marqueurs
    markers.forEach(m => m.setMap(null));
    markers = [];

    hebergements.forEach(h => {
      const color = getColorForType(h.type);
      const icon = {
        path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z',
        fillColor: color,
        fillOpacity: 1,
        strokeWeight: 1.2,
        strokeColor: '#ffffff',
        scale: 1.2,
        anchor: new google.maps.Point(12, 20)
      };

      const marker = new google.maps.Marker({
        position: { lat: h.lat, lng: h.lng },
        map: map,
        icon: icon,
        title: h.nom,
        animation: google.maps.Animation.DROP
      });

      // InfoWindow
      marker.addListener('click', () => {
        const content = `
          <div style="font-family:Poppins, sans-serif; padding:4px 2px; max-width:220px; color:#3e2e28;">
            <div style="font-weight:600; font-size:1.05rem;">${h.nom}</div>
            <div style="display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px;">
              <span style="background:${getColorForType(h.type)}20; padding:0 10px; border-radius:40px; font-size:0.7rem; color:${getColorForType(h.type)};">${h.type}</span>
              <span style="color:#7d6452; font-size:0.75rem;">✉️ ${h.contact}</span>
            </div>
            <div style="margin-top:4px;">
              <span style="font-weight:500;">⭐ ${h.note.toFixed(1)}</span>
              <span style="color:#7d6452; font-size:0.75rem; margin-left:6px;">(${h.avis} avis)</span>
            </div>
          </div>
        `;
        if (infoWindow) infoWindow.close();
        infoWindow = new google.maps.InfoWindow({ content });
        infoWindow.open(map, marker);
      });

      markers.push(marker);
    });
  }

  // ----- INITIALISATION DE LA CARTE -----
  function initMap() {
    const paris = { lat: 48.8566, lng: 2.3522 };
    map = new google.maps.Map(document.getElementById('map'), {
      center: paris,
      zoom: 12,
      mapTypeId: 'roadmap',
      mapTypeControl: false,
      streetViewControl: false,
      styles: [
        { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] }
      ]
    });

    // Créer les marqueurs
    createMarkers();

    // Mise à jour du tableau (distance depuis Paris par défaut)
    updateDistanceTable(paris.lat, paris.lng);
    originLabelEl.textContent = 'Paris (défaut)';

    // ----- AUTOCOMPLETE (Google Places) -----
    const input = document.getElementById('pac-input');
    autocomplete = new google.maps.places.Autocomplete(input, {
      types: ['geocode', 'establishment'],
      fields: ['geometry', 'formatted_address']
    });

    autocomplete.addListener('place_changed', () => {
      const place = autocomplete.getPlace();
      if (!place.geometry || !place.geometry.location) {
        // fallback : on ne change rien
        return;
      }
      const lat = place.geometry.location.lat();
      const lng = place.geometry.location.lng();
      // centrer la carte
      map.setCenter({ lat, lng });
      map.setZoom(12);

      // mettre à jour l'origine
      currentOrigin = { lat, lng };
      const address = place.formatted_address || 'Lieu sélectionné';
      originLabelEl.textContent = address;

      // mettre à jour le tableau
      updateDistanceTable(lat, lng);

      // (optionnel) ajouter un marqueur temporaire ? non demandé.
    });

    // Gérer la touche "Entrée" sans sélection (pour éviter un comportement étrange)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
      }
    });
  }

  // ----- CHARGEMENT DE LA MAP (callback global) -----
  // On expose initMap dans l'objet window pour que l'API Google Maps l'appelle
  window.initMap = initMap;

  // (fallback) Si l'API ne charge pas, on affiche un message
  console.log('✅ Google Maps API chargée via script externe.');
</script>

<!-- Chargement de l'API Google Maps avec Places -->
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7Lm-LYRnXQFMMR-8c9sD1ZjGp5C_nI-M&libraries=places&callback=initMap">
</script>

</body>
</html>
